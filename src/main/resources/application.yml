server:
  port: 8090
spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true   # 요청 처리 스레드를 가상 스레드로 — 대기 중인 채팅 연결을 싸게 붙잡는다
  data:
    redis:
      url: ${LOG_REDIS_URL:redis://redis:6379}   # 미지정 시 Spring 기본 localhost = 컨테이너 자신 (함정)
management:
  endpoints:
    web:
      exposure:
        include: health
# 공부 기록 DB(study.db.url · user · password)는 여기 적지 않는다 — 환경 변수 STUDY_DB_URL · STUDY_DB_USER · STUDY_DB_PASSWORD 가
# 그대로 그 키가 되고(스프링의 느슨한 이름 맞추기), 값이 없을 때의 기본은 ProgressConfiguration 에 있다(값이 없어도 앱은 뜬다).
# 여기 적으면 이 파일이 SpringApplicationBuilder.properties 로 준 값(엔진 테스트)보다 앞서 그 값을 가린다(실측).
