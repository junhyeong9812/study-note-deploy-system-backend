# 무중단 배포: 앱은 두 자리(blue·green)로 뜨고 nginx 가 그중 하나로 보낸다. 평소에는 한 자리만 떠 있다.
# 전환은 ci-cd agent 가 한다(deploy/active/upstream.conf 교체 → nginx reload). 수동 조작은 ci-cd README 참고.
x-app: &app
  build: .
  image: backend-app:${IMAGE_TAG:-local}   # ci-cd: CI 가 커밋 태그로 빌드, CD 가 그 태그로 교체
  environment:
    ES_URL: http://elasticsearch:9200
    EMBEDDING_URL: http://embedding:8080
    LLM_URL: ${LLM_URL:?set-in-env}          # .164 wrapper (배포 .env — repo에 IP 금지)
    CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-} # 에스컬레이션 브리지 — 비우면 escalate_unavailable
    BRIDGE_SECRET: ${BRIDGE_SECRET:-}          # 브리지 인증
    OWNER_COOKIE_SECRET: ${OWNER_COOKIE_SECRET:-} # 주인 표시 쿠키의 서명 열쇠(어드민과 같은 값) — 비우면 누구도 주인이 아니다
    LOG_REDIS_URL: redis://redis:6379
    SERVER_NAME: backend
    SYNC_SECRET: ${SYNC_SECRET:?set-in-env}
    STUDY_NOTE_REMOTE: https://github.com/junhyeong9812/study-note.git
    REPO_DIR: /data/study-note/repo
    STATE_FILE: /data/study-note/last_sha
    # 공부 기록 DB — 아래 postgres 와 같은 값(.env 의 STUDY_DB_*)으로 조립한다. 비밀번호는 .env 에만
    STUDY_DB_URL: jdbc:postgresql://postgres:5432/${STUDY_DB_NAME:?set-in-env}
    STUDY_DB_USER: ${STUDY_DB_USER:?set-in-env}
    STUDY_DB_PASSWORD: ${STUDY_DB_PASSWORD:?set-in-env}
  volumes:
    - study-note-repo:/data/study-note       # clone 볼륨 (sync가 pull)
  depends_on:
    elasticsearch:
      condition: service_healthy
    redis:
      condition: service_started
    embedding:
      condition: service_healthy   # BGE-M3 모델 로딩(1~2분) 전에 /embed를 치면 연결 거부 (실측)
  healthcheck:
    # localhost 금지 — 컨테이너 안에서 ::1로 풀려 IPv4 바인딩 서버가 unhealthy로 찍힘
    test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:8090/actuator/health || exit 1"]
    interval: 30s
    timeout: 10s
    retries: 3
  restart: unless-stopped
  stop_grace_period: 30s

services:
  app-blue:
    <<: *app
    profiles: ["blue"]           # 이름을 지정해야만 뜬다 — `docker compose up -d` 가 두 자리를 한꺼번에 띄우지 않게
    container_name: backend-app-blue
    ports:
      - "127.0.0.1:18090:8090"     # agent 의 자리별 헬스 확인용 — 외부에는 nginx 만 열린다
  app-green:
    <<: *app
    profiles: ["green"]
    container_name: backend-app-green
    ports:
      - "127.0.0.1:18091:8090"

  nginx:
    image: nginx:1.27-alpine
    container_name: backend-nginx
    ports:
      # 전제: 호스트는 사설 LAN 단일 인터페이스(공유기 뒤). 공인 인터페이스가 생기면 BIND_ADDR로 제한 (리뷰 B14)
      - "${BIND_ADDR:?set-in-env}:8090:8090"   # fail-closed — 배포 .env가 LAN 주소 지정 (감사 반영)
    volumes:
      # nginx 는 git 밖의 활성 디렉토리만 읽는다(서버에만 있다): nginx.conf(본 설정 사본) + upstream.conf(활성 자리).
      # ci-cd agent 가 전환할 때 deploy/nginx/ 의 원본을 여기로 복사하고, 전환에 실패하면 이전 내용으로 되돌린다.
      # git 작업 트리를 직접 읽게 하면 배포 중 소스 갱신만으로 운영 설정이 바뀐다.
      - ./deploy/active:/etc/nginx:ro
    restart: unless-stopped
    logging:   # 접속 기록(통신 규약 v1)이 표준 출력으로 가므로 크기를 묶는다 — 에이전트는 json-file 을 도커 API 로 읽는다
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  elasticsearch:
    build: ./elasticsearch
    container_name: backend-es
    expose:
      - "9200"               # 내부 전용 — 호스트·LAN 비노출 (경계: 앱만 엣지에)
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"          # LAN 내부 전용 전제
      ES_JAVA_OPTS: "-Xms2g -Xmx2g"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # 방문 스트림 · 그날의 소금 · 대화 이력 · 로그 · 지표 · 통신 스트림 — 디스크 저장(AOF)을 켠다: 다시 떠도 아직 넘어가지 않은 방문 · 소금 · 대화가 남는다.
  # 지운 항목이 메모리에 남지 않게 노드당 항목 1 · 디스크(AOF 파일)에 오래 남지 않게 다시 쓰기의 문턱을 작게(10% · 1mb) +
  # 아래 redis-aof-rewrite 가 30분마다 다시 쓰기를 시킨다(드문 날에도). RDB 스냅숏은 켜지 않는다. 데이터는 볼륨 backend-redis-data(README "한계 — Redis 의 디스크 저장")
  redis:
    image: redis:7-alpine
    container_name: backend-redis
    # 뜰 때 /data 의 남은 임시 파일을 먼저 지운다 — 다시 쓰기(또는 BGSAVE) 도중 강제 종료(SIGKILL · 정전 · OOM)되면 자식이 쓰던
    # temp-rewriteaof-*.aof · temp-*.rdb(그때의 전체 데이터 — 지운 방문의 원문 포함)가 남고, Redis 는 다시 떠도 이것을 지우지 않는다(7.4 실측).
    # 그 뒤 이미지의 entrypoint 로 exec 한다 — redis 사용자로 내려가 redis-server 가 PID 1 이 된다(신호 · healthcheck 가 그대로).
    command:
      - sh
      - -c
      - >-
        for f in /data/temp-rewriteaof-*.aof /data/temp-*.rdb; do
        [ -e "$$f" ] || continue;
        if rm -f "$$f"; then echo "redis-start: removed leftover temp file $$f";
        else echo "redis-start: FAILED to remove leftover temp file $$f — 지운 방문의 원문이 디스크에 남아 있을 수 있다" >&2; fi;
        done;
        exec /usr/local/bin/docker-entrypoint.sh "$$@"
      - redis-start
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --stream-node-max-entries
      - "1"
      - --auto-aof-rewrite-percentage
      - "10"
      - --auto-aof-rewrite-min-size
      - 1mb
    volumes:
      - backend-redis-data:/data   # 디스크 저장(AOF 파일)의 자리 — 이름 있는 볼륨이라 컨테이너를 다시 만들어도 남는다(`compose down -v` 에는 지워진다)
    ports:
      - "${BIND_ADDR:?set-in-env}:6379:6379"   # LAN — llm(.164) 등 타 호스트가 XADD (docs/logging.md 예약 포트)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # redis 에 주기로 BGREWRITEAOF 를 시킨다 — 지운 방문의 원문이 AOF 파일에서 보통 약 30분 안에 사라지게(Redis 에는 시간으로 다시 쓰는 설정이 없다).
  # 자리(blue/green)가 아니다 — postgres 처럼 이름 없이 `docker compose up -d` 할 때 뜨고, 배포 에이전트는 이것을 다시 만들지 않는다.
  # Redis 가 아직 없거나 다시 쓰기가 이미 도는 중(already in progress)이어도 끝나지 않고 다음 주기에 다시 한다.
  # Redis 에 닿았는데 다시 쓰기를 거절하거나(디스크가 완전히 참 등 — ERR …) 시킨 다시 쓰기의 결과(INFO persistence)를 기다려(최대 한 주기)
  # 실패 · 시간 초과 · 결과를 못 읽음이면 표준 오류에 한 줄을 남긴다 —
  # `docker logs backend-redis-aof-rewrite 2>&1 | grep 'redis-aof-rewrite: FAILED'`(README "한계 — Redis 의 디스크 저장").
  # 주기가 바닥(60초) 이상의 정수가 아니면(0 · 음수 · 글자) 한 줄(BAD-INTERVAL)을 남기고 1800초로 돈다(.env 에서 비워 두면 compose 가 먼저 1800 으로 바꾼다).
  # 되풀이는 뒤에서 돌리고 이 셸(PID 1)은 wait 한다 — Redis 에 닿지 못해 redis-cli 가 매달린 동안(이름 풀이 약 20초)에도 SIGTERM 에 바로 끝난다.
  redis-aof-rewrite:
    image: redis:7-alpine
    container_name: backend-redis-aof-rewrite
    environment:
      REDIS_AOF_REWRITE_INTERVAL_SECONDS: ${REDIS_AOF_REWRITE_INTERVAL_SECONDS:-1800}
      REDIS_AOF_REWRITE_MIN_INTERVAL_SECONDS: "60"   # 주기의 바닥 — scripts/redis-persistence-check.sh 만 낮춰 띄운다(운영에서 바꾸지 않는다)
    command:
      - sh
      - -c
      - |
        trap 'exit 0' TERM INT
        interval="$$REDIS_AOF_REWRITE_INTERVAL_SECONDS"
        if ! { case "$$interval" in ''|*[!0-9]*) false ;; esac && [ "$$interval" -ge "$$REDIS_AOF_REWRITE_MIN_INTERVAL_SECONDS" ]; } 2>/dev/null; then
          echo "redis-aof-rewrite: BAD-INTERVAL REDIS_AOF_REWRITE_INTERVAL_SECONDS='$$interval' 는 $$REDIS_AOF_REWRITE_MIN_INTERVAL_SECONDS 이상의 정수가 아니다 — 1800초로 돈다" >&2
          interval=1800
        fi
        field() { printf '%s\n' "$$info" | sed -n "s/^$$1://p"; }
        while true; do
          sleep "$$interval"
          info="$$(redis-cli -h redis INFO persistence 2>/dev/null | tr -d '\r')"
          rewrites="$$(field aof_rewrites)"
          reply="$$(redis-cli -h redis BGREWRITEAOF 2>&1)"; reached=$$?
          echo "$$reply"
          case "$$reply" in
            *started*|*scheduled*) ;;
            *'already in progress'*) continue ;;
            *) [ "$$reached" = 0 ] && echo "redis-aof-rewrite: FAILED rewrite-error reply='$$(printf '%s' "$$reply" | tr '\r\n' '  ')' — 다시 쓰기를 시작하지 못했다. 지운 방문의 원문이 디스크에 남아 있다(Redis 의 로그를 보라)" >&2
               continue ;;
          esac
          waited=0
          while true; do
            info="$$(redis-cli -h redis INFO persistence 2>/dev/null | tr -d '\r')"
            if [ -z "$$(field aof_rewrite_in_progress)" ]; then
              echo "redis-aof-rewrite: FAILED rewrite-unknown — Redis 에서 다시 쓰기의 결과를 읽지 못했다. 지운 방문의 원문이 디스크에 남아 있을 수 있다" >&2
              break
            fi
            # 시킨 것이 끝났다 = 아무것도 돌지 않는다 · 또는 그 뒤의 다시 쓰기가 이미 시작됐다(aof_rewrites 는 시작할 때 는다 — 시키기 전보다 2 이상)
            if [ "$$(field aof_rewrite_in_progress)$$(field aof_rewrite_scheduled)" = 00 ] || { [ -n "$$rewrites" ] && [ "$$(field aof_rewrites)" -ge $$((rewrites + 2)) ]; }; then
              [ "$$(field aof_last_bgrewrite_status)" = ok ] || echo "redis-aof-rewrite: FAILED rewrite-error aof_last_bgrewrite_status=$$(field aof_last_bgrewrite_status) — 다시 쓰기가 실패했다. 지운 방문의 원문이 디스크에 남아 있다(Redis 의 로그를 보라)" >&2
              break
            fi
            if [ "$$waited" -ge "$$interval" ]; then
              echo "redis-aof-rewrite: FAILED rewrite-timeout — 다시 쓰기가 $${interval}초 안에 끝나지 않았다. 끝날 때까지 지운 방문의 원문이 디스크에 남아 있다" >&2
              break
            fi
            sleep 1
            waited=$$((waited + 1))
          done
        done &
        wait $$!
    mem_limit: 32m
    restart: unless-stopped

  # 공부 기록(방문자 · 퀴즈 시도). profiles 가 없어 이름 없이 `docker compose up -d` 해도 뜬다. 두 자리가 같은 DB 를 본다.
  # 앱은 depends_on 으로 이것을 기다리지 않는다 — DB 가 죽어도 앱은 뜨고 읽기는 된다(명세 11.1). 관측 서버의 DB 와는 따로다.
  postgres:
    image: postgres:17-alpine
    container_name: backend-postgres
    environment:
      POSTGRES_DB: ${STUDY_DB_NAME:?set-in-env}
      POSTGRES_USER: ${STUDY_DB_USER:?set-in-env}
      POSTGRES_PASSWORD: ${STUDY_DB_PASSWORD:?set-in-env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data   # 호스트 디렉터리 — 이름 있는 볼륨은 `compose down -v` 한 번에 함께 지워진다
    # ports 를 두지 않는다 — LAN 에도 호스트에도 열지 않고, 같은 compose 네트워크의 두 자리만 닿는다
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

  embedding:
    image: embedding-embedding:latest          # local-llm에서 보존한 BGE-M3 이미지 (.158 로컬)
    container_name: backend-embedding
    expose:
      - "8080"               # 내부 전용 — backend만 호출
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # /health/deep — GPU 실추론 확인(얕은 /health는 GPU 유실을 6일간 못 잡은 실측 이력).
      # 이미지에 curl 없음 → python urllib (local-llm 원본 방식). 매 체크가 GPU 추론 1건이라 간격 60s.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health/deep', timeout=20)\" || exit 1"]
      interval: 60s
      timeout: 25s
      retries: 5
      start_period: 300s     # 모델 로딩 여유
    restart: unless-stopped

volumes:
  es-data:
  study-note-repo:
  backend-redis-data:
    name: backend-redis-data   # 프로젝트 이름이 앞에 붙지 않게 — 이 이름 그대로
