# 무중단 배포용 전환 프록시 — 외부 포트를 받아 활성 자리(blue 또는 green)로 넘긴다.
worker_processes 1;
# reload 뒤에도 그 전에 열린 연결(SSE 스트림 등)은 구 자리에서 계속 처리한다. 3분이 지나면 끊는다.
worker_shutdown_timeout 180s;

events { worker_connections 1024; }

http {
    # 활성 자리: upstream app 과 $deploy_slot 을 정의한다. ci-cd agent 가 이 파일을 바꾸고 reload 한다.
    include /etc/nginx/active/upstream.conf;

    server {
        listen 8090;
        # 지금 어느 자리가 응답했는지 — agent 가 전환이 실제로 적용됐는지 이 값으로 판정한다
        add_header X-Deploy-Slot $deploy_slot always;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 스트림(SSE·NDJSON)을 모으지 않고 바로 흘린다
            proxy_buffering off;
            proxy_pass_header X-Accel-Buffering;   # 앞단 프록시도 버퍼링하지 않도록 그대로 전달
            proxy_connect_timeout 5s;
            proxy_read_timeout 200s;               # 앱의 유휴 감시(150초)보다 길게
            proxy_send_timeout 200s;
        }
    }
}
