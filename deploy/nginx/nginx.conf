# 무중단 배포용 전환 프록시 — 외부 포트를 받아 활성 자리(blue 또는 green)로 넘긴다.
# 이 파일은 원본이다. nginx 가 실제로 읽는 것은 ci-cd agent 가 전환 때 deploy/active/ 로 복사한 사본이다.
worker_processes 1;
# reload 뒤에도 그 전에 열린 연결(SSE 스트림 등)은 구 자리에서 계속 처리한다. 3분이 지나면 끊는다.
worker_shutdown_timeout 180s;

events { worker_connections 1024; }

http {
    # 활성 자리: $deploy_slot 과 $deploy_upstream 을 정의한다. ci-cd agent 가 이 파일을 바꾸고 reload 한다.
    include /etc/nginx/upstream.conf;

    # 앱 주소를 요청 때마다 도커 내부 DNS 로 찾는다(5초 캐시). 설정을 읽을 때 한 번만 찾으면
    # 앱 컨테이너가 재시작돼 주소가 바뀌었을 때 reload 전까지 502 가 이어지고, 앱이 아직 없으면 nginx 가 뜨지도 못한다.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # --- 통신 규약 v1 — docs/cross-cutting/plans/2026-11-25/traffic-map/communication-protocol.md
    # 연결 주소는 아래 판정에만 쓴다. 접속 기록에는 싣지 않는다. set_real_ip_from 을 두지 않는다(1.3).
    geo $from_private {
        default        0;
        127.0.0.0/8    1;
        10.0.0.0/8     1;
        172.16.0.0/12  1;
        192.168.0.0/16 1;
        ::1/128        1;
        fc00::/7       1;
        fe80::/10      1;
    }
    geo $from_edge { default 0; }   # 엣지 판정은 아직 없다 — 엣지에서 온 연결도 밖으로 본다(front 는 T11 에서 include 로 바꾼다)

    # 요청 ID: 사설 대역(엣지 아님)에서 온 꼴 맞는 값만 받고, 아니면 nginx 가 만든다(1.3).
    map "$from_edge$from_private:$http_x_request_id" $protocol_request_id {
        "~^01:(?<incoming_request_id>[A-Za-z0-9_-]{1,64})$" $incoming_request_id;
        default                                              $request_id;
    }

    # 호출자: 엣지 연결은 edge, 사설 대역의 아는 이름은 그 이름, 나머지는 outside(2.2).
    map "$from_edge$from_private:$http_x_caller_service" $protocol_caller {
        "01:front"       front;
        "01:backend"     backend;
        "01:llm-wrapper" llm-wrapper;
        "01:alert"       alert;
        "01:observe"     observe;
        "01:admin"       admin;
        "01:ci-master"   ci-master;
        "01:ci-agent"    ci-agent;
        "~^1"            edge;
        default          outside;
    }

    # 경로: 첫 ? 앞의 1024자까지(3.2).
    map $request_uri $protocol_path {
        "~^(?<request_path_head>[^?]{0,1024})" $request_path_head;
        default                                 "";
    }
    map $request_uri $protocol_path_truncated {
        "~^[^?]{1025}" true;
        default        false;
    }

    # 접속 기록: 표준 출력에 JSON 한 줄. 주소 · 쿼리 · 리퍼러 · User-Agent · 쿠키 · 인증 머리글은 싣지 않는다(3.5).
    log_format protocol_v1 escape=json
        '{"v":1,"ts":$msec,"request_id":"$protocol_request_id","caller":"$protocol_caller",'
        '"service":"backend","method":"$request_method","path":"$protocol_path",'
        '"path_truncated":$protocol_path_truncated,"status":$status,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","upstream_status":"$upstream_status",'
        '"slot":"$deploy_slot","bytes_sent":$body_bytes_sent}';
    access_log /dev/stdout protocol_v1;

    server {
        listen 8090;
        # 지금 어느 자리가 응답했는지 — agent 가 전환이 실제로 적용됐는지 이 값으로 판정한다
        add_header X-Deploy-Slot $deploy_slot always;
        add_header X-Request-Id $protocol_request_id always;   # 요청 ID 를 응답에 돌려준다(1.2)
        client_max_body_size 10m;

        location / {
            proxy_pass http://$deploy_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id     $protocol_request_id;   # 앱은 nginx 가 정한 값만 받는다(1.3)
            proxy_set_header X-Caller-Service $protocol_caller;
            proxy_hide_header X-Request-Id;                           # 앱이 낸 값과 겹치지 않게
            # 스트림(SSE·NDJSON)을 모으지 않고 바로 흘린다
            proxy_buffering off;
            proxy_pass_header X-Accel-Buffering;   # 앞단 프록시도 버퍼링하지 않도록 그대로 전달
            proxy_connect_timeout 5s;
            proxy_read_timeout 200s;               # 앱의 유휴 감시(150초)보다 길게
            proxy_send_timeout 200s;
        }
    }
}
